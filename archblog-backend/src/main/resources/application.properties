# === Application Identity ===
spring.application.name=archblog-backend

# === Server Port ===
server.port=${PORT:8080}

# === Aiven PostgreSQL DB Connection ===
spring.datasource.url=jdbc:postgresql://pg-212af3b5-archblog-backend.a.aivencloud.com:28193/defaultdb?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# === Hibernate / JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === HikariCP Configuration ===
spring.datasource.hikari.auto-commit=false

# === Resend Configuration ===
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
